server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location = / {
        try_files /app.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # O app é um arquivo único: o navegador sempre confere se há versão nova.
    location = /app.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Sem 404 no console: ícone padrão e sonda do DevTools do Chrome.
    location = /favicon.ico { return 204; access_log off; }
    location = /.well-known/appspecific/com.chrome.devtools.json { return 204; access_log off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 200s;   # consultas de IA (modelo de raciocínio) podem levar mais de 60 s
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
