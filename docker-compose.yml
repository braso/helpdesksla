services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - helpdesk

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - .:/var/www
    environment:
      APP_ENV:     development
      APP_URL:     http://localhost:8080   # endereço público usado nos links dos e-mails
      APP_TIMEZONE: America/Sao_Paulo      # fuso das datas exibidas nos e-mails
      DB_HOST:     db
      DB_PORT:     3306
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: secret
      JWT_SECRET:  "b3a5c8e2f1d4a7b0c9e3f6a2d5b8c1e4f7a0d3b6c9e2f5a8d1b4c7e0f3a6d9"
      JWT_TTL:     3600
      SLA_WORK_START: 9
      SLA_WORK_END:   18
      SLA_TIMEZONE:   ${SLA_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk


  # Agendador: busca de e-mails e verificação de SLA a cada 5 minutos (.docker/cron/crontab).
  scheduler:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    command: ["sh", "-c", "export -p > /tmp/cron.env && cp /var/www/.docker/cron/crontab /etc/crontabs/root && exec crond -f -l 6"]
    volumes:
      - .:/var/www
    environment:
      APP_ENV:     development
      APP_URL:     http://localhost:8080   # endereço público usado nos links dos e-mails
      APP_TIMEZONE: America/Sao_Paulo      # fuso das datas exibidas nos e-mails
      DB_HOST:     db
      DB_PORT:     3306
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: secret
      JWT_SECRET:  "b3a5c8e2f1d4a7b0c9e3f6a2d5b8c1e4f7a0d3b6c9e2f5a8d1b4c7e0f3a6d9"
      JWT_TTL:     3600
      SLA_WORK_START: 9
      SLA_WORK_END:   18
      SLA_TIMEZONE:   ${SLA_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - helpdesk
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE:      helpdesk
      MYSQL_USER:          helpdesk
      MYSQL_PASSWORD:      secret
    volumes:
      - db_data:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      # Na primeira subida (volume vazio) cria o schema e os dados iniciais
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "helpdesk", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - helpdesk

volumes:
  db_data:

networks:
  helpdesk:
    driver: bridge
